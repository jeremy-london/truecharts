name: Update Helm Catalog

on:
  schedule:
    # Run every Friday night at approximately 10–11 PM Mountain Time (05:00 UTC Saturday).
    - cron: '0 5 * * 6'
  # Allow manual triggering
  workflow_dispatch:

concurrency:
  group: update-helm-catalog
  cancel-in-progress: false

permissions:
  contents: write  # Ensure the workflow can push to main

jobs:
  update-catalog:
    name: Update Helm Catalog
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Fetch all history for all branches and tags
          fetch-depth: 0
      
      - name: Configure Git
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
      
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.6.2"
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"
      
      - name: Install dependencies
        working-directory: .updater
        run: uv sync
      
      - name: Run update script
        working-directory: .updater
        run: uv run python update.py
        continue-on-error: false
      
      - name: Commit and push changes to main
        run: |
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore: update helm catalog"
            git push origin main
          else
            echo "No changes to commit"
          fi
